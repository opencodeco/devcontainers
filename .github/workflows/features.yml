name: Features
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  features:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
    - uses: actions/checkout@v3
    - name: Check install-php-extensions
      run: bash tests/install-php-extensions.sh
    - name: Features
      uses: devcontainers/action@v1
      with:
        publish-features: "true"
        base-path-to-features: "./features"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
